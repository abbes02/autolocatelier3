spring.application.name=autoloc

# Connexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate / JPA
# Atelier Associations:
# 1) Mettre temporairement create pour supprimer/recreer le schema.
# 2) Lancer l'application et verifier les tables.
# 3) Remettre update (valeur finale ci-dessous).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.tic.ssa.autoloc=INFO

server.port=8081
